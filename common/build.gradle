plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = "Firefly-common-${minecraftMajor}"
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	systemProperty 'firefly.oracle.firstSeed', providers.gradleProperty('oracleFirstSeed').getOrElse('0')
	systemProperty 'firefly.oracle.worlds', providers.gradleProperty('oracleWorlds').getOrElse('4')
	useJUnitPlatform {
		excludeTags 'mod'
	}
}

loom {
	accessWidenerPath = file('src/main/resources/firefly.accesswidener')
}
